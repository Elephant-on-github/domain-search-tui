[package]
name = "tldscan"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Terminal app that checks domain availability across 20 TLDs and compares registrar prices"
license = "MIT"
homepage = "https://github.com/Elephant-on-github/tldscan"
repository = "https://github.com/Elephant-on-github/tldscan"
keywords = ["domain", "dns", "tui", "registrar", "pricing"]

[[bin]]
name = "tldscan"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "6"
futures = "0.3"
open = "5"
